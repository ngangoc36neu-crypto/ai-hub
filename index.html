<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apero AI Knowledge Hub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F4F5F7;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px}
.app{display:flex;width:100%;max-width:1100px;min-height:calc(100vh - 48px);border-radius:12px;overflow:hidden;border:1px solid #e0e0e0;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.sidebar{width:200px;background:#1B3358;flex-shrink:0;display:flex;flex-direction:column}
.sidebar-header{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,0.1)}
.sidebar-header p{margin:0;font-size:13px;font-weight:600;color:#fff}
.sidebar-header span{display:block;margin-top:3px;font-size:11px;color:rgba(255,255,255,0.45)}
.nav{padding:10px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13px;color:rgba(255,255,255,0.65);cursor:pointer;border-radius:6px;margin:2px 8px;transition:background .15s,color .15s}
.nav-item:hover{background:rgba(255,255,255,0.09);color:#fff}
.nav-item.active{background:rgba(255,255,255,0.16);color:#fff;font-weight:600}
.nav-item i{font-size:16px}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.1)}
.sync-btn{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,0.5);cursor:pointer;background:none;border:none;padding:0}
.sync-btn:hover{color:rgba(255,255,255,0.8)}
.content{flex:1;background:#F4F5F7;padding:24px;overflow-y:auto}
.page{display:none}.page.active{display:block}
.page-title{font-size:18px;font-weight:600;color:#1a1a2e;margin-bottom:16px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:10px;padding:16px;border:1px solid #e8e8e8}
.stat-card .label{font-size:12px;color:#888;display:flex;align-items:center;gap:5px;margin-bottom:8px}
.stat-card .value{font-size:24px;font-weight:700;color:#1a1a2e}
.stat-card .value.small{font-size:16px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border-radius:10px;border:1px solid #e8e8e8;padding:16px 20px}
.card-title{font-size:13px;font-weight:600;color:#888;margin-bottom:12px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;display:inline-block;font-weight:500}
.tag.verified{background:#e6f9f0;color:#0a7a4b}
.tag.draft{background:#f0f0f0;color:#666}
.medal{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.err-banner{background:#fef2f2;color:#c0392b;border:1px solid #fbb;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}

/* Asset cards */
.asset-card{background:#fff;border-radius:10px;border:1px solid #e8e8e8;margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}
.asset-card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.asset-header{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.asset-info{flex:1;min-width:0}
.asset-name{font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:3px}
.asset-meta{font-size:12px;color:#888}
.asset-counts{display:flex;align-items:center;gap:12px;flex-shrink:0}
.count-badge{display:flex;align-items:center;gap:4px;font-size:13px;color:#555;font-weight:500}
.star-count{color:#854F0B}
.fork-count{color:#185FA5}

/* GitHub-style action buttons */
.asset-actions{display:flex;gap:8px;flex-shrink:0}
.gh-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid;transition:all .15s}
.gh-star-btn{background:#fff;border-color:#d1d5db;color:#24292f}
.gh-star-btn:hover,.gh-star-btn.active{background:#FEF8EC;border-color:#EF9F27;color:#854F0B}
.gh-fork-btn{background:#fff;border-color:#d1d5db;color:#24292f}
.gh-fork-btn:hover,.gh-fork-btn.active{background:#EEF4FC;border-color:#378ADD;color:#0C447C}

/* Inline form panel */
.action-panel{display:none;border-top:1px solid #f0f0f0;padding:16px;background:#fafafa}
.action-panel.open{display:block}
.panel-tabs{display:flex;gap:8px;margin-bottom:16px}
.panel-tab{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #ddd;background:#fff;color:#666}
.panel-tab.active{background:#1B3358;color:#fff;border-color:#1B3358}
.panel-form{display:none}.panel-form.active{display:block}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none;transition:border .15s;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#1B3358}
.form-group textarea{resize:vertical}
.check-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.check-row input{width:16px;height:16px;cursor:pointer;flex-shrink:0}
.check-row label{font-size:13px;cursor:pointer;color:#444}
.form-actions{display:flex;align-items:center;gap:8px}
.submit-btn{padding:8px 18px;background:#1B3358;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.submit-btn:hover{background:#244070}
.cancel-btn{padding:8px 14px;background:#fff;color:#666;border:1px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer}
.cancel-btn:hover{background:#f5f5f5}
.inline-alert{padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:10px;display:none}
.inline-alert.error{background:#fef2f2;color:#c0392b;border:1px solid #fbb}
.inline-alert.success{background:#f0faf5;color:#0a7a4b;border:1px solid #b3e6cc}

/* Leaderboard */
.lb-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0}
.lb-row:last-child{border-bottom:none}
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#aaa;font-size:16px;pointer-events:none}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none}
.search-wrap input:focus{border-color:#1B3358}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <p>Apero AI Hub</p>
      <span>Knowledge Platform</span>
    </div>
    <div class="nav">
      <div class="nav-item active" onclick="nav('dashboard')"><i class="ti ti-home"></i>Dashboard</div>
      <div class="nav-item" onclick="nav('assets')"><i class="ti ti-file"></i>Danh sách asset</div>
      <div class="nav-item" onclick="nav('leaderboard')"><i class="ti ti-chart-bar"></i>Leaderboard</div>
    </div>
    <div class="sidebar-footer">
      <button class="sync-btn" onclick="loadAll()">
        <i class="ti ti-refresh"></i><span id="sync-label">Làm mới dữ liệu</span>
      </button>
      <p id="last-sync" style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:6px"></p>
    </div>
  </div>

  <div class="content">
    <div id="err-banner" class="err-banner"></div>

    <!-- DASHBOARD -->
    <div id="p-dashboard" class="page active">
      <p class="page-title">Dashboard</p>
      <div class="stat-grid">
        <div class="stat-card"><div class="label"><i class="ti ti-file"></i>Tổng asset</div><div class="value" id="d-assets">—</div></div>
        <div class="stat-card"><div class="label"><i class="ti ti-star"></i>Stars hợp lệ</div><div class="value" id="d-stars">—</div></div>
        <div class="stat-card"><div class="label"><i class="ti ti-copy"></i>Forks hợp lệ</div><div class="value" id="d-forks">—</div></div>
        <div class="stat-card"><div class="label"><i class="ti ti-chart-bar"></i>Tổng thưởng</div><div class="value small" id="d-reward">—</div></div>
      </div>
      <div class="two-col">
        <div class="card"><p class="card-title">Top 5 asset</p><div id="d-top"></div></div>
        <div class="card"><p class="card-title">Leaderboard nhanh</p><div id="d-lb"></div></div>
      </div>
    </div>

    <!-- ASSETS -->
    <div id="p-assets" class="page">
      <p class="page-title">Danh sách asset</p>
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input id="search-input" oninput="filterAssets()" placeholder="Tìm theo tên, domain, loại...">
      </div>
      <div id="assets-list"></div>
    </div>

    <!-- LEADERBOARD -->
    <div id="p-leaderboard" class="page">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <p class="page-title" style="margin:0">Leaderboard</p>
        <div style="display:flex;gap:6px">
          <button id="lb-tab-point" onclick="switchLbTab('point')" style="padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:#1B3358;color:#fff">⭐ Theo điểm</button>
          <button id="lb-tab-money" onclick="switchLbTab('money')" style="padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #ddd;background:#fff;color:#666">💰 Theo tiền</button>
        </div>
      </div>
      <div id="lb-full"></div>
    </div>
  </div>
</div>

<script>
const SB="https://oaedfqlvbsnlwizdmhkj.supabase.co";
const KEY="sb_publishable_5Y_cXwgxziFm4cymOgGynQ_3pqkdwtO";
const H={"apikey":KEY,"Authorization":"Bearer "+KEY};
const HP={...H,"Content-Type":"application/json","Prefer":"return=minimal"};
let DB={assets:[],users:[],stars:[],forks:[]};

const fmt=n=>new Intl.NumberFormat("vi-VN").format(n)+" ₫";
const esc=s=>String(s||"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":`&gt;`,"&":"&amp;",'"':"&quot;"}[c]));

async function get(t){
  const r=await fetch(SB+"/rest/v1/"+t+"?select=*",{headers:H});
  if(!r.ok)throw new Error("Lỗi "+r.status+" khi tải bảng "+t);
  return r.json();
}
async function post(t,body){
  const r=await fetch(SB+"/rest/v1/"+t,{method:"POST",headers:HP,body:JSON.stringify(body)});
  if(!r.ok){const e=await r.text();throw new Error("Lỗi "+r.status+": "+e);}
}

function nav(page){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  document.getElementById("p-"+page).classList.add("active");
  const idx={dashboard:0,assets:1,leaderboard:2};
  document.querySelectorAll(".nav-item")[idx[page]].classList.add("active");
}

function filterAssets(){
  const q=document.getElementById("search-input").value.toLowerCase();
  renderAssets(DB.assets.filter(a=>[a.asset_name,a.domain,a.asset_type,a.owner_name].some(v=>(v||"").toLowerCase().includes(q))));
}

function togglePanel(assetId,tab){
  const panel=document.getElementById("panel-"+assetId);
  const starBtn=document.getElementById("star-btn-"+assetId);
  const forkBtn=document.getElementById("fork-btn-"+assetId);
  const isOpen=panel.classList.contains("open");
  const currentTab=panel.dataset.tab;

  if(isOpen && currentTab===tab){
    panel.classList.remove("open");
    starBtn.classList.remove("active");
    forkBtn.classList.remove("active");
    return;
  }
  panel.classList.add("open");
  panel.dataset.tab=tab;
  panel.querySelectorAll(".panel-tab").forEach(t=>t.classList.remove("active"));
  panel.querySelectorAll(".panel-form").forEach(f=>f.classList.remove("active"));
  document.getElementById("tab-"+tab+"-"+assetId).classList.add("active");
  document.getElementById("form-"+tab+"-"+assetId).classList.add("active");
  starBtn.classList.toggle("active",tab==="star");
  forkBtn.classList.toggle("active",tab==="fork");
}

function renderAssets(list){
  const sC={},fC={};
  DB.stars.filter(s=>s.is_valid).forEach(s=>{sC[s.asset_id]=(sC[s.asset_id]||0)+1;});
  DB.forks.filter(f=>f.is_valid).forEach(f=>{fC[f.original_asset_id]=(fC[f.original_asset_id]||0)+1;});
  const userOpts=DB.users.map(u=>`<option value="${u.id}">${esc(u.full_name)}</option>`).join("");
  const el=document.getElementById("assets-list");
  if(!list.length){el.innerHTML='<div class="card"><p style="font-size:13px;color:#aaa;padding:8px 0">Không tìm thấy asset nào</p></div>';return;}
  el.innerHTML=list.map(a=>`
    <div class="asset-card">
      <div class="asset-header">
        <div class="asset-info" onclick="togglePanel(${a.id},'star')">
          <div class="asset-name">${esc(a.asset_name)}</div>
          <div class="asset-meta">${esc(a.domain||"—")} · ${esc(a.asset_type||"—")} · <span style="color:#1B3358;font-weight:500">${esc(a.owner_name||"—")}</span></div>
        </div>
        <div class="asset-counts">
          <span class="count-badge star-count"><i class="ti ti-star" style="font-size:14px"></i>${sC[a.id]||0}</span>
          <span class="count-badge fork-count"><i class="ti ti-copy" style="font-size:14px"></i>${fC[a.id]||0}</span>
          <span class="tag ${a.status==="Verified"?"verified":"draft"}">${esc(a.status||"Draft")}</span>
        </div>
        <div class="asset-actions">
          <button id="star-btn-${a.id}" class="gh-btn gh-star-btn" onclick="togglePanel(${a.id},'star')">
            <i class="ti ti-star" style="font-size:13px"></i>Star
          </button>
          <button id="fork-btn-${a.id}" class="gh-btn gh-fork-btn" onclick="togglePanel(${a.id},'fork')">
            <i class="ti ti-copy" style="font-size:13px"></i>Fork
          </button>
        </div>
      </div>

      <div id="panel-${a.id}" class="action-panel" data-tab="">
        <div class="panel-tabs">
          <button id="tab-star-${a.id}" class="panel-tab" onclick="togglePanel(${a.id},'star')"><i class="ti ti-star" style="font-size:13px"></i> Star asset này</button>
          <button id="tab-fork-${a.id}" class="panel-tab" onclick="togglePanel(${a.id},'fork')"><i class="ti ti-copy" style="font-size:13px"></i> Fork asset này</button>
        </div>

        <!-- STAR FORM -->
        <div id="form-star-${a.id}" class="panel-form">
          <div id="serr-${a.id}" class="inline-alert error"></div>
          <div id="sok-${a.id}" class="inline-alert success"></div>
          <div class="form-group">
            <label class="form-label">Bạn là ai</label>
            <select id="suser-${a.id}"><option value="">-- Chọn tên --</option>${userOpts}</select>
          </div>
          <div class="form-group">
            <label class="form-label">Lý do star (bắt buộc)</label>
            <textarea id="sreason-${a.id}" rows="2" placeholder="Tại sao asset này hữu ích với bạn?"></textarea>
          </div>
          <div class="check-row">
            <input type="checkbox" id="scross-${a.id}">
            <label for="scross-${a.id}">Star từ team khác (cross-team)</label>
          </div>
          <div class="form-actions">
            <button class="submit-btn" onclick="submitStar(${a.id})"><i class="ti ti-star" style="font-size:13px"></i>Xác nhận star · +200.000 ₫</button>
            <button class="cancel-btn" onclick="togglePanel(${a.id},'star')">Hủy</button>
          </div>
        </div>

        <!-- FORK FORM -->
        <div id="form-fork-${a.id}" class="panel-form">
          <div id="ferr-${a.id}" class="inline-alert error"></div>
          <div id="fok-${a.id}" class="inline-alert success"></div>
          <div class="form-group">
            <label class="form-label">Bạn là ai</label>
            <select id="fuser-${a.id}"><option value="">-- Chọn tên --</option>${userOpts}</select>
          </div>
          <div class="form-group">
            <label class="form-label">Dùng vào việc gì</label>
            <textarea id="fdesc-${a.id}" rows="2" placeholder="Mô tả use case của bạn..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Thay đổi so với bản gốc</label>
            <textarea id="fchanges-${a.id}" rows="2" placeholder="Bạn đã chỉnh sửa hoặc thêm gì?"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Link output (không bắt buộc)</label>
            <input id="flink-${a.id}" type="text" placeholder="https://...">
          </div>
          <div class="form-actions">
            <button class="submit-btn" onclick="submitFork(${a.id})"><i class="ti ti-copy" style="font-size:13px"></i>Xác nhận fork · +500.000 ₫</button>
            <button class="cancel-btn" onclick="togglePanel(${a.id},'fork')">Hủy</button>
          </div>
        </div>
      </div>
    </div>`).join("");
}

function showInline(errId,okId,msg,isOk){
  const e=document.getElementById(errId),o=document.getElementById(okId);
  e.style.display="none";o.style.display="none";
  if(isOk){o.style.display="block";o.textContent=msg;}
  else{e.style.display="block";e.textContent=msg;}
}

async function submitStar(id){
  const uId=parseInt(document.getElementById("suser-"+id).value);
  const reason=document.getElementById("sreason-"+id).value.trim();
  const cross=document.getElementById("scross-"+id).checked;
  if(!uId){showInline("serr-"+id,"sok-"+id,"Hãy chọn tên của bạn",false);return;}
  if(!reason){showInline("serr-"+id,"sok-"+id,"Lý do star là bắt buộc",false);return;}
  try{
    await post("Stars",{asset_id:id,user_id:uId,reason,is_cross_team:cross,is_valid:true,reward_amount:200000});
    showInline("serr-"+id,"sok-"+id,"Star thành công! +200.000 ₫ đã được ghi nhận",true);
    document.getElementById("sreason-"+id).value="";
    document.getElementById("scross-"+id).checked=false;
    setTimeout(()=>loadAll(),1000);
  }catch(e){showInline("serr-"+id,"sok-"+id,e.message,false);}
}

async function submitFork(id){
  const uId=parseInt(document.getElementById("fuser-"+id).value);
  const desc=document.getElementById("fdesc-"+id).value.trim();
  const chg=document.getElementById("fchanges-"+id).value.trim();
  const link=document.getElementById("flink-"+id).value.trim();
  if(!uId){showInline("ferr-"+id,"fok-"+id,"Hãy chọn tên của bạn",false);return;}
  if(!desc){showInline("ferr-"+id,"fok-"+id,"Mô tả use case là bắt buộc",false);return;}
  if(!chg){showInline("ferr-"+id,"fok-"+id,"Mô tả thay đổi là bắt buộc",false);return;}
  try{
    await post("Forks",{original_asset_id:id,forked_by_user_id:uId,fork_description:desc,changes_made:chg,output_link:link||null,is_valid:true,reward_amount:500000});
    showInline("ferr-"+id,"fok-"+id,"Fork thành công! +500.000 ₫ đã được ghi nhận",true);
    document.getElementById("fdesc-"+id).value="";
    document.getElementById("fchanges-"+id).value="";
    document.getElementById("flink-"+id).value="";
    setTimeout(()=>loadAll(),1000);
  }catch(e){showInline("ferr-"+id,"fok-"+id,e.message,false);}
}

function renderDashboard(){
  const vS=DB.stars.filter(s=>s.is_valid),vF=DB.forks.filter(f=>f.is_valid);
  const tot=vS.reduce((s,x)=>s+(x.reward_amount||0),0)+vF.reduce((s,x)=>s+(x.reward_amount||0),0);
  document.getElementById("d-assets").textContent=DB.assets.length;
  document.getElementById("d-stars").textContent=vS.length;
  document.getElementById("d-forks").textContent=vF.length;
  document.getElementById("d-reward").textContent=fmt(tot);
  const sC={},fC={};
  vS.forEach(s=>{sC[s.asset_id]=(sC[s.asset_id]||0)+1;});
  vF.forEach(f=>{fC[f.original_asset_id]=(fC[f.original_asset_id]||0)+1;});
  const top=[...DB.assets].map(a=>({...a,sc:sC[a.id]||0,fc:fC[a.id]||0})).sort((a,b)=>(b.sc+b.fc)-(a.sc+a.fc)).slice(0,5);
  document.getElementById("d-top").innerHTML=top.length?top.map((a,i)=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;${i>0?"border-top:1px solid #f0f0f0":""}">
      <p style="margin:0;font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px">${esc(a.asset_name)}</p>
      <span style="font-size:12px;color:#888;flex-shrink:0"><i class="ti ti-star" style="font-size:12px;color:#854F0B"></i> ${a.sc} &nbsp;<i class="ti ti-copy" style="font-size:12px;color:#185FA5"></i> ${a.fc}</span>
    </div>`).join(""):'<p style="font-size:13px;color:#aaa">Chưa có asset</p>';
  const oR={};
  vS.forEach(s=>{const a=DB.assets.find(x=>x.id===s.asset_id);if(a){oR[a.owner_name]=(oR[a.owner_name]||0)+(s.reward_amount||0);}});

async function loadAll(){
  document.getElementById("sync-label").textContent="Đang tải...";
  document.getElementById("err-banner").style.display="none";
  try{
    const [a,u,s,f]=await Promise.all([get("Assets"),get("Users"),get("Stars"),get("Forks")]);
    DB={assets:a,users:u,stars:s,forks:f};
    renderDashboard();
    renderAssets(a);
    renderLeaderboard();
    document.getElementById("last-sync").textContent="Cập nhật "+new Date().toLocaleTimeString("vi-VN");
  }catch(e){
    const el=document.getElementById("err-banner");
    el.style.display="block";
    el.textContent=e.message;
  }
  document.getElementById("sync-label").textContent="Làm mới dữ liệu";
}

loadAll();
